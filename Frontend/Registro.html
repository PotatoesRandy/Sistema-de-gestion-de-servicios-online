<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Ayuntamiento Online</title>
    <link rel="stylesheet" href="CSS/App.css">
</head>
<body>
    <div class="auth-shell">
        <section class="auth-brand">
            <div>
                <h1>Crear cuenta</h1>
                <p>Tu registro se guarda en la tabla usuarios y te lleva directo al dashboard.</p>
            </div>
        </section>
        <section class="auth-panel">
            <form class="auth-card" id="registerForm">
                <h2>Registro</h2>
                <p>Completa los datos principales para empezar a solicitar servicios municipales.</p>
                <div id="authMessage" class="message"></div>
                <div class="form-grid">
                    <div class="field">
                        <label for="nombre">Nombre</label>
                        <input id="nombre" name="nombre" required>
                    </div>
                    <div class="field">
                        <label for="apellido">Apellido</label>
                        <input id="apellido" name="apellido" required>
                    </div>
                    <div class="field">
                        <label for="username">Usuario</label>
                        <input id="username" name="username" required>
                    </div>
                    <div class="field">
                        <label for="telefono">Telefono</label>
                        <input id="telefono" name="telefono">
                    </div>
                    <div class="field full">
                        <label for="email">Correo</label>
                        <input id="email" name="email" type="email" required>
                    </div>
                    <div class="field full">
                        <label for="password">Contrasena</label>
                        <input id="password" name="password" type="password" required>
                    </div>
                </div>
                <div class="actions">
                    <button type="submit">Registrar</button>
                    <a class="button secondary" href="Login.html">Ya tengo cuenta</a>
                </div>
            </form>
        </section>
    </div>
    <script src="JS/app.js"></script>
    <script>ServiciosApp.initRegistro();</script>
</body>
</html>
