<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ayuntamiento Online</title>
    <link rel="stylesheet" href="CSS/App.css">
</head>
<body>
    <div class="auth-shell">
        <section class="auth-brand">
            <div>
                <h1>Ayuntamiento Online</h1>
                <p>Gestiona servicios municipales, reservas, reportes y opiniones desde un solo panel.</p>
            </div>
        </section>
        <section class="auth-panel">
            <form class="auth-card" id="loginForm">
                <h2>Iniciar sesion</h2>
                <p>Ingresa con un usuario de la tabla usuarios.</p>
                <div id="authMessage" class="message"></div>
                <div class="field">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">Contrasena</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <div class="actions">
                    <button type="submit">Entrar</button>
                    <a class="button secondary" href="Registro.html">Crear cuenta</a>
                </div>
            </form>
        </section>
    </div>
    <script src="JS/app.js"></script>
    <script>ServiciosApp.initLogin();</script>
</body>
</html>
