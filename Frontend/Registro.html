<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Servicios Online</title>
    <link rel="stylesheet" href="/CSS/Registro.css">
</head>
<body>
    <div class="login">
        <div class="login-left">
            <div class="login-left-content">
                <h2>Servicios Online</h2>
                <p>Crea tu cuenta para obtener acceso a todos los servicios desde cualquier dispositivo.</p>
            </div>
        </div>
        <div class="login-right">
            <h1>Registrarse</h1>
            <form action="/registro" method="post">
                <div class="usuario">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="usuario">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Registrar</button>
                <a href="/Login.html">¿Ya tiene cuenta? Inicie sesión aquí.</a>
            </form>
        </div>
    </div>
</body>
</html>
